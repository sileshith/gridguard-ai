name: Local software and aggregate report
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -e '.[test,plots,report]'
      - run: python scripts/validate_data.py --help
      - run: python scripts/run_pipeline.py --help
      - run: python scripts/smoke_pipeline.py --output results/local/ci_smoke
      - run: python -m pytest -q -p no:cacheprovider
      - run: python scripts/build_flagship_report.py
      - run: python scripts/build_dashboard.py
      - run: python scripts/validate_publication.py
