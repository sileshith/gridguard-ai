[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "gridguard-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyspark==4.0.1", "PyYAML>=6,<7", "numpy>=1.24,<3", "scipy>=1.10,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
plots = ["matplotlib>=3.9,<4"]
report = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "nbconvert>=7.16,<8", "ipykernel>=6,<8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
